<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/icons/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero, which the header,
         the bottom tab bar and the toast all depend on. No maximum-scale: suppressing zoom to
         work around iOS Safari's focus-zoom would also disable accessibility zoom, and the
         16px input floor is the correct fix. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Matches the real body background. #0f1117 left a visible seam at the status bar. -->
    <meta name="theme-color" content="#111214" />
    <!-- The News section links out to dozens of news sites a day. The browser default would hand
         each of them this dashboard's origin, which is not something to give a stranger's site. -->
    <meta name="referrer" content="no-referrer" />
    <!-- Chrome fires beforeinstallprompt once, ~100 ms after load, which is before the app has
         hydrated. The install button in Settings needs that event, so it is kept here (see
         `$lib/pwa.svelte.ts`). Its hash lives in hooks.server.ts (INLINE_INSTALL_PROMPT_HASH). -->
    <script>
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__pidraInstallPrompt = e; });
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" data-theme="cerberus">
    <div style="display: contents">%sveltekit.body%</div>
    <!--
      Inline on purpose, not a `<script src>`: this runs in the same request as the document, with
      no separate network round trip - a `src` load is exactly the bare, unbudgeted fetch the
      offline design (CLAUDE.md, "Offline mode") exists to avoid, and it would hang for the OS
      connect timeout in a blackhole instead of failing fast. The tradeoff is that a strict
      script-src CSP has to allowlist this exact content by hash (hooks.server.ts, RESOURCE_CSP) -
      that hash must be updated if this script's text changes, or `CSP_REPORT_ONLY` will start
      logging a violation for it, which is the trip wire that catches a stale hash.
    -->
    <script>
      // Migration off the old /sw.js worker: a registration at a different
      // scriptURL does not replace the old one, so a device left on the old worker would keep
      // serving stale assets and would lose push once static/sw.js is gone. Safe to delete this
      // cleanup block a few weeks after this ships, once no installed device is still on it.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          for (const reg of regs) {
            const url = reg.active?.scriptURL ?? reg.installing?.scriptURL ?? reg.waiting?.scriptURL ?? '';
            if (url.endsWith('/sw.js')) reg.unregister();
          }
        }).catch(() => {});
        if ('caches' in window) {
          caches.keys()
            .then((keys) => Promise.all(keys.filter((k) => k === 'pidra-shell-v1' || k === 'pidra-reports-v1').map((k) => caches.delete(k))))
            .catch(() => {});
        }
        navigator.serviceWorker.register('/service-worker.js', { type: 'module' }).catch(() => {});
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/icons/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero, which the header,
         the bottom tab bar and the toast all depend on. No maximum-scale: suppressing zoom to
         work around iOS Safari's focus-zoom would also disable accessibility zoom, and the
         16px input floor is the correct fix. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Matches the real body background. #0f1117 left a visible seam at the status bar. -->
    <meta name="theme-color" content="#111214" />
    <!-- The News section links out to dozens of news sites a day. The browser default would hand
         each of them this dashboard's origin, an address that exists only inside the VPN. -->
    <meta name="referrer" content="no-referrer" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" data-theme="cerberus">
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      // Migration off the old /sw.js worker: a registration at a different
      // scriptURL does not replace the old one, so a device left on the old worker would keep
      // serving stale assets and would lose push once static/sw.js is gone. Safe to delete this
      // cleanup block a few weeks after this ships, once no installed device is still on it.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          for (const reg of regs) {
            const url = reg.active?.scriptURL ?? reg.installing?.scriptURL ?? reg.waiting?.scriptURL ?? '';
            if (url.endsWith('/sw.js')) reg.unregister();
          }
        }).catch(() => {});
        if ('caches' in window) {
          caches.keys()
            .then((keys) => Promise.all(keys.filter((k) => k === 'pidra-shell-v1' || k === 'pidra-reports-v1').map((k) => caches.delete(k))))
            .catch(() => {});
        }
        navigator.serviceWorker.register('/service-worker.js', { type: 'module' }).catch(() => {});
      }
    </script>
  </body>
</html>
